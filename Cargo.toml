[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.102"
base64 = { version = "0.22", default-features = false, features = ["std"] }
minijinja = { version = "2.19.0", default-features = false, features = ["builtins", "loader", "serde", "macros"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
config = { version = "0.15.22", default-features =  false, features = ["toml"] }
fd-lock = "4.0.4"
insta = { version = "1.47.2", default-features = false, features = ["glob", "colors", "json", "filters"] }
jsonschema = { version = "0.39.0", default-features = false }
octocrab = "0.50.0"
pretty_assertions = { version = "1.4.1", default-features = false, features = ["std"] }
schemars = { version = "1.2.1", default-features =  false, features = ["std", "derive"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std", "preserve_order"] }
tempfile = "3.13.0"
thiserror = { version = "2.0.18", default-features =    false, features = ["std"] }
toml = { version = "0.8.19", default-features = false, features = ["parse"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "process", "fs", "io-util", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
test-log = { version = "0.2.20", default-features = false, features = ["trace"] }
which = "8.0.0"


[workspace.lints.rust]
missing_docs = "deny"
unused_imports = "deny"

[workspace.lints.clippy]
unused_trait_names = "deny"
unwrap_in_result = "deny"
empty_loop = "deny"