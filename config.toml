# Local smoke-test config — see assets/example.config.toml for the full
# annotated template.

# --- Storage -------------------------------------------------------------
# Use the operator's existing stacks-bench DB rather than the
# framework-default <framework>/data/stacks-bench location.
stacks_bench_data_dir = "/Users/cylwit/.stacks-bench"

# --- Benchmark workload --------------------------------------------------
source_dir            = "/Volumes/Extern/mainnet.compressed"
stacks_bench_network  = "mainnet"
stacks_bench_start_at = 7_000_000
stacks_bench_count    = 25_000
stacks_bench_warmup   = 5_000
# This chainstate has non-canonical holes; iterating every block trips
# `Error: No such Stacks block`. The user's prior successful runs all
# used --filter contract-call, which restricts measurement to blocks
# with contract-call activity and naturally skips the gaps.
stacks_bench_filter   = "contract-call"

# --- Triage --------------------------------------------------------------
stacks_bench_axis_weights      = "0.4,0.4,0.2"
single_run_noise_floor_pct     = 1.0

# --- Codex ---------------------------------------------------------------
codex_model                    = "gpt-5.5"
codex_reasoning_effort         = "high"
codex_dangerously_bypass_sandbox = false
codex_exec_timeout_sec         = 3600
