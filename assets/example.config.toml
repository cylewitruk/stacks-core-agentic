# config.toml — single source of truth for the bench-agent workflow.
#
# Copy this file to `~/.config/sbagent/config.toml` (or pass
# `-c <path>` to point elsewhere). Stanzas mirror the sub-structs in
# crates/stacks-bench-agent/src/settings.rs. Every field is optional —
# the documented default or required-arg error applies when a field is
# unset.


# ---------------------------------------------------------------------------
# [dev] — framework / developer-only knobs. Operators leave this section out.
# ---------------------------------------------------------------------------

# [dev]
# Absolute path to your stacks-bench-agent checkout. Only needed when
# iterating on sbagent itself (running `sbagent schema export`, the
# typed-model drift gate, etc.). Operator deployments leave this unset.
# framework_root = "/absolute/path/to/stacks-bench-agent"


# ---------------------------------------------------------------------------
# [layout] — operator filesystem topology.
# Per-domain paths live in their own stanza
# (`stacks_bench.data_dir`, `publish.token_file`).
# ---------------------------------------------------------------------------

[layout]
# Primary operator tuning surface — prompt template overrides + sibling
# bundle dirs. `sbagent init` seeds bundled defaults into
# `<operator>/.sbagent/{prompts,schemas,queries,context}/`. `sbagent sync`
# refreshes them after a binary upgrade; `--keep-tunables` preserves
# operator-edited prompts/context (schemas + queries still refresh).
prompt_overrides_dir = ".sbagent/prompts"

# Bundle mirrors. Default to siblings of `prompt_overrides_dir`, so the
# conventional `.sbagent/{prompts,schemas,queries,context}/` layout
# works without setting these explicitly.
# schemas_dir            = ".sbagent/schemas"
# queries_dir            = ".sbagent/queries"
# context_overrides_dir  = ".sbagent/context"

# Cross-session bot memory (analyzed-rejections ledger today). When
# `prompt_overrides_dir` is `.sbagent/prompts`, the default LIFTS out
# of `.sbagent/` and lands at top-level `<operator>/memory/` — this is
# accumulated bot knowledge, not bundled/synced state, so it lives
# alongside `.sbagent/` rather than inside it. Setting `memory_dir`
# explicitly is honored verbatim (no lift applied), so `.sbagent/memory`
# is a legitimate operator choice if you want it co-located.
# memory_dir             = "memory"

# Where durable session artifacts live. Defaults to
# `<framework_root>/sessions`. Override for non-conventional layouts.
# sessions_root = "/absolute/path/to/operator/sessions"

# Absolute path to the operator's git repo (holds `sessions/`, `repos/`,
# `sessions.jsonl`, and `session/<id>` archive branches). Required by
# `session archive`. Defaults to `sessions_root.parent()` ONLY when
# `sessions_root` is set explicitly above; when `sessions_root` itself
# defaulted (e.g. derived from `agent_workspace_root`), set this
# explicitly. MUST be absolute.
# operator_repo_root = "/absolute/path/to/operator"

# Where coordination lockfiles live (`benchmark.lock`, `test.lock`).
# Defaults to `<framework_root>/data/run/`.
# lock_dir = "/absolute/path/to/data/run"

# Mutable agent scratch (per-target git clones, build caches). Defaults
# to the legacy `<sessions_root>/<id>/worktrees/`. macOS recommended:
# `/private/tmp/sbagent-workspaces/`. Linux: `/var/tmp/...` or
# `$XDG_CACHE_HOME/sbagent/`.
# agent_workspace_root = "/private/tmp/sbagent-workspaces"


# ---------------------------------------------------------------------------
# [source] — source repo to optimize.
# ---------------------------------------------------------------------------
# Per-session source clones are materialized at session start from this
# stanza into a bare object cache under `<agent_workspace_root>/cache/`,
# then into a per-session checkout under
# `<agent_workspace_root>/sessions/<id>/repos/<cache_id>/` (`sbagent
# source cache-id` prints the id). See `docs/git-topology.md`.
#
# IMPORTANT: when `--publish-accepted-prs` is in play, `[source].url`
# MUST be a writable fork (the bot's PAT in `publish.token_file` must
# have Contents:write on it). Phase 5 pushes `agentic/<id>/<target>`
# branches via `git push origin <branch>` in per-target clones, whose
# `origin` resolves to `[source].url` — there is no separate publish
# remote. The fork's `[source].branch` must stay in sync with the
# branch the bot's PRs target (`publish.base_branch`); operators keep
# this current out-of-band via `git fetch upstream && git push origin`.

[source]
# Required. Clone URL for the source repo (HTTPS or SSH). For publish
# sessions, point at the bot's writable fork, e.g.
#   https://github.com/<bot>/stacks-core.git
# For read-only experimentation (no `--publish-accepted-prs`), the
# canonical upstream works too.
url = "https://github.com/<bot>/stacks-core.git"

# Required. Branch sessions fetch + clone. Should match
# `publish.base_branch` for publish sessions.
branch = "feat/stacks-bench"

# Optional. Stable id for the bare cache dir name. When unset, sbagent
# derives a deterministic `<canonical-url-slug>-<sha256-prefix>` id at
# runtime. Set this only when you want a human-readable cache path.
# Must match `^[a-z](?:[a-z0-9-]{0,62}[a-z0-9])?$`.
# id = "stacks-core-upstream"


# ---------------------------------------------------------------------------
# [stacks_bench] — `stacks-bench` invocation params.
# ---------------------------------------------------------------------------

[stacks_bench]
# Required by `session baseline run`. Chainstate source dir; must
# contain `chainstate/`.
source_dir = "/mnt/chainstate/mainnet"

# Default network. Override only for testnet / regtest workloads.
network = "mainnet"

# Required by `session baseline run` and `session run` (Phase 0 + 3
# share the resolved range). Also exposed as `--start-at` /
# `--count` / `--warmup` / `--filter` CLI flags (+ env vars) so the
# closed-loop can sample different windows per invocation without
# mutating config. Precedence: CLI > env > config.
#
# Canonical Nakamoto-era ranges to pick from:
#   5_000_000 – 5_025_000
#   6_500_000 – 6_525_000
#   7_300_000 – 7_325_000
start_at = 5_000_000
count    = 25_000

# Optional. Pre-window blocks to advance through before measurement
# (lets caches/JIT settle). No warmup when unset.
# warmup = 5_000

# Optional `--filter` arg (e.g. `contract-call`). Restricts which
# blocks in the range get replayed — useful on chainstates with
# non-canonical forks.
# filter = "contract-call"

# `stacks-bench`'s own app-data dir (SQLite store). Defaults to
# `<framework_root>/data/stacks-bench`.
# data_dir = "/absolute/path/to/data/stacks-bench"

# Parent dir for `stacks-bench`'s reflink shadow copy. Set this when
# the default — `source_dir.parent()` — isn't writable from the codex
# sandbox (e.g. `/Volumes/Extern`). MUST be on the same filesystem as
# `source_dir`.
# shadow_dir = "/var/tmp/stacks-bench-shadow"


# ---------------------------------------------------------------------------
# [triage] — Phase 1 tuning.
# ---------------------------------------------------------------------------

[triage]
# Selection-lens weights (tx_latency,tenure_throughput,commit_time).
# Default biases toward execution-side optimizations over commit-side,
# which suits contract-heavy workloads.
axis_weights = "0.4,0.4,0.2"

# Conservative noise-floor fallback used when only a single baseline
# run is imported (no rerun for noise estimation).
single_run_noise_floor_pct = 1.0

# Soft cap on candidate count per session. Orchestrator warns (doesn't
# reject) when triage emits more than this.
# candidate_soft_cap = 20


# ---------------------------------------------------------------------------
# [analyzer] — Phase 1.5 tuning.
# ---------------------------------------------------------------------------

# [analyzer]
# Max analyzer subagents the fan-out runs in parallel. Each is one
# Codex call with deep reasoning, several minutes per family.
# concurrency_cap = 4

# Operator cap on `verification_replay.invocations[]` length per
# analyzer-emitted target. Enforced at analyzer-output validation,
# BEFORE any stacks-bench command runs in Phase 1.8. Tighter than the
# schema hard max of 16 — typical sessions run 10-20 candidates and
# each invocation costs minutes of bench time.
# max_invocations_per_target = 8


# ---------------------------------------------------------------------------
# [optimizer] — Phase 2 tuning.
# ---------------------------------------------------------------------------

# [optimizer]
# Max inner-loop attempts per target before giving up. Combined with
# `budget_minutes` as "whichever exhausts first". `normal_pr` only —
# `consensus_poc_pr` keeps the one-shot scoped-tests model.
# attempts        = 5
# Wall-clock budget per target (minutes). Soft cap the agent
# self-enforces; `codex.exec_timeout_sec` is the hard kill.
# budget_minutes  = 60


# ---------------------------------------------------------------------------
# [results_analysis] — Phase 3.5 results-analyzer config.
# ---------------------------------------------------------------------------

# [results_analysis]
# Minimum confidence required for a `normal_pr` target to publish in
# Phase 5. Verdicts whose confidence is below this floor are skipped by
# `decide_publish` with an explicit "below floor" reason — operator
# review decides whether to ship.
#
# Values: "high" | "medium" | "low". Defaults to "medium" — `high` and
# `medium` confidence verdicts ship; `low` holds for operator review.
# Tighten to "high" for safety-critical sessions; drop to "low" to
# disable the gate (every shippable verdict flows through).
# confidence_floor = "medium"


# ---------------------------------------------------------------------------
# [codex] — shared Codex CLI knobs.
# ---------------------------------------------------------------------------

[codex]
# Shared by every phase, including merge. Defaults to `gpt-5.5`.
model = "gpt-5.5"
reasoning_effort = "high"

# Per-phase override. Inherits `reasoning_effort` when unset.
# merge_reasoning_effort = "high"

# Outer timeout (seconds) for each `codex exec`. 0 disables.
exec_timeout_sec = 3600

# Set true ONLY on demo VMs that can't support Codex's internal
# sandbox.
dangerously_bypass_sandbox = false

# Extra absolute paths to grant write access in the codex sandbox, on
# top of the per-phase `add_dirs`. Codex's `-c` config grammar replaces
# array values rather than deep-merging, so any `writable_roots` in
# `~/.codex/config.toml` would be silently dropped without this list.
# extra_writable_roots = ["/Users/op/Library/Caches/sccache"]


# ---------------------------------------------------------------------------
# [publish] — Phase 5 PR / issue targets.
# Section is OPTIONAL (only needed for autonomous publish flows).
# ---------------------------------------------------------------------------

[publish]
# Absolute path to the GitHub PAT file. Mode 0600, owned by the agent
# user. Defaults to `${HOME}/.config/sbagent/gh_token`.
#
# Recommended: a **fine-grained** PAT scoped to the bot's two repos
# (`<bot>/stacks-core` for optimizer PRs + the bot's operator repo for
# `sbagent init --push`). Permissions:
#   - Contents: Read & write
#   - Pull requests: Read & write
#   - Issues: Read & write
#   - Metadata: Read-only (auto-included)
# Add `workflow` permission only if the bot needs to touch `.github/`.
#
# MUST live OUTSIDE the framework root: `publish generate` passes the
# framework root to Codex via `--add-dir`; a token inside that tree is
# reachable by the LLM. Enforced at preflight.
# token_file = "/absolute/path/outside/framework/gh_token"

# Git remote name in the optimizer worktrees.
remote = "origin"

# PRs target the bot's fork (least blast radius). Override to
# stacks-network/stacks-core only when explicitly going upstream.
base_repo   = "cylewitruk/stacks-core"
base_branch = "feat/stacks-bench"

# `normal_pr` PRs are drafts by default. `consensus_poc_pr` is always
# draft regardless.
draft_prs = true

# Branch prefix: full branch name is `<prefix>/<session-id>/<target-id>`.
branch_prefix = "agentic"

# pr_labels  = ["needs-bench-review"]
# head_owner = "cylewitruk"


# ---------------------------------------------------------------------------
# [maintain] — post-publish PR / issue lifecycle reconciliation.
# Section is OPTIONAL. Defaults are conservative for manual runs; scheduled
# cadence lives in the future cron layer, not here.
# ---------------------------------------------------------------------------

# [maintain]
# Days since GitHub `updated_at` before an open PR/issue is considered stale.
# stale_after_days = 14

# Stop querying within one `sbagent maintain` invocation when the latest
# GitHub response reports remaining requests below this percentage of the
# bucket. Cross-invocation rate management belongs to the scheduler.
# secondary_rate_limit_floor_pct = 10


# ---------------------------------------------------------------------------
# [autonomy] — safety gates for unattended session starts.
# Section is OPTIONAL. These gates block `sbagent session run` before expensive
# work starts; `sbagent maintain` remains allowed while paused.
# ---------------------------------------------------------------------------

# [autonomy]
# Block new sessions when this many bot PRs are currently open according to
# sessions.jsonl + maintain.jsonl.
# max_open_agent_prs = 10

# Block new sessions when the most recent archived session is newer than this
# threshold.
# min_session_interval_hours = 144

# Automatically write .sbagent/pause after this many completed sessions in a
# row produce zero accepted targets. Set to 0 to disable.
# zero_accepted_circuit_breaker = 3

# Block exact fix signatures from re-entering optimizer fan-out after this many
# unsuccessful archived attempts. Lifetime count in v12.
# dedup_failure_threshold = 3


# ---------------------------------------------------------------------------
# [preflight] — session-start safety floors.
# ---------------------------------------------------------------------------

# [preflight]
# Minimum free disk space (gibibytes) on the filesystem holding
# `layout.agent_workspace_root` before a session may start. When set,
# the preflight emits a hard FAIL if available space is below the
# threshold and surfaces the exact `sbagent workspace prune
# --older-than 7d --archived-only` invocation as the remediation.
#
# When unset (default), the preflight emits a WARN only below a
# conservative 10 GiB floor — pick a real value once you've measured
# a session's peak per-target disk usage.
#
# Skipped entirely when `layout.agent_workspace_root` isn't configured
# (operator deployments that pin everything inline).
# min_free_gib = 40


# ---------------------------------------------------------------------------
# [git] — commit identity + PAT-via-extraheader auth.
# ---------------------------------------------------------------------------

# [git]
# Author identity for every agent-generated commit. Injected as
# GIT_AUTHOR_* / GIT_COMMITTER_* env-vars (no .gitconfig mutation).
# author_name  = "stacks-bench-bot"
# author_email = "283996447+stacks-bench-bot@users.noreply.github.com"

# PAT-via-extraheader auth used by `init --push` and by every
# agent-side push (Phase 5 publish). Defaults below match GitHub
# fine-grained PATs; override per forge:
#   - GitHub (any PAT):           auth_username = "x-access-token"  (default)
#   - GitLab PATs / project tokens: auth_username = "oauth2"
#   - Bitbucket Cloud app pwds:   auth_username = "<bitbucket-username>"
#   - Self-hosted Gitea/Forgejo:  auth_username = "git" or bot account
#
# `auth_url_prefix` is also the validation gate for `--push` origin.
# Trailing slash normalized internally.
# Empty string ("") is expert mode (token attached unqualified — only
# safe when every HTTPS remote git contacts is audited).
# auth_username   = "x-access-token"
# auth_url_prefix = "https://github.com/"
